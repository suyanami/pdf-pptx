<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NotebookLMで生成されたPDFスライドを編集可能なPPTXファイルに変換するWebアプリケーション">
    <title>PDF to PPTX Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs" type="module"></script>

    <!-- PptxGenJS -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">📄</span>
                    <h1>PDF to PPTX</h1>
                </div>
                <p class="tagline">領域を選択して編集可能なPowerPointに変換</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section" id="uploadSection">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <div class="drop-icon">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                        </div>
                        <p class="drop-text">PDFファイルをドロップ</p>
                        <p class="drop-subtext">または クリックして選択</p>
                        <input type="file" id="fileInput" accept=".pdf" hidden>
                    </div>
                </div>
            </section>

            <!-- Editor Section -->
            <section class="editor-section hidden" id="editorSection">
                <!-- Toolbar -->
                <div class="editor-toolbar">
                    <div class="toolbar-left">
                        <button class="btn-tool" id="btnBack" title="ファイル選択に戻る">
                            ← 戻る
                        </button>
                        <button class="btn-tool btn-auto" id="btnAutoDetect" title="自動でパーツを検出">
                            ✨ 自動検出
                        </button>
                    </div>
                    <div class="toolbar-center">
                        <span class="mode-label">選択モード:</span>
                        <div class="mode-toggle">
                            <button class="btn-mode active" id="btnTextMode" data-mode="text">
                                🔤 テキスト
                            </button>
                            <button class="btn-mode" id="btnImageMode" data-mode="image">
                                🖼️ 画像
                            </button>
                        </div>
                        <span class="mode-label" style="margin-left: 20px;">抽出:</span>
                        <div class="mode-toggle">
                            <button class="btn-mode active" id="btnOcrMode" data-extract="ocr" title="Tesseract OCR">
                                📝 OCR
                            </button>
                            <button class="btn-mode" id="btnVlmMode" data-extract="vlm" title="Ollama LLaVA (要サーバー起動)">
                                🤖 VLM
                            </button>
                        </div>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn-tool" id="btnClearPage" title="このページの選択をクリア">
                            🗑️ クリア
                        </button>
                    </div>
                </div>

                <!-- Editor Main Area -->
                <div class="editor-main">
                    <!-- Canvas Area -->
                    <div class="canvas-area">
                        <div class="canvas-container" id="canvasContainer">
                            <canvas id="pdfCanvas"></canvas>
                            <canvas id="overlayCanvas"></canvas>
                        </div>
                        <!-- Page Navigation -->
                        <div class="page-nav">
                            <button class="btn-nav" id="prevPage" disabled>◀</button>
                            <span class="page-info">
                                <span id="currentPage">1</span> / <span id="totalPages">1</span>
                            </span>
                            <button class="btn-nav" id="nextPage" disabled>▶</button>
                        </div>
                    </div>

                    <!-- Region List Panel -->
                    <div class="region-panel">
                        <h3 class="panel-title">📋 選択した領域</h3>
                        <div class="region-list" id="regionList">
                            <p class="empty-message">領域が選択されていません。<br>左のプレビューでドラッグして選択してください。</p>
                        </div>
                        <div class="panel-actions">
                            <button class="btn-secondary" id="btnClearAll">
                                全てクリア
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Generate Button -->
                <div class="generate-section">
                    <button class="btn-generate" id="btnGenerate" disabled>
                        ⬇️ PPTXを生成してダウンロード
                    </button>
                </div>

                <!-- Progress -->
                <div class="progress-section hidden" id="progressSection">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-info">
                            <span class="progress-text" id="progressText">処理中...</span>
                            <span class="progress-percent" id="progressPercent">0%</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Download Section -->
            <section class="download-section hidden" id="downloadSection">
                <div class="success-message">
                    <div class="success-icon">✅</div>
                    <h3>変換完了！</h3>
                    <p>PPTXファイルの準備ができました</p>
                </div>
                <button class="btn-download" id="downloadBtn">
                    ⬇️ PPTXをダウンロード
                </button>
                <button class="btn-secondary" id="resetBtn">
                    別のファイルを変換
                </button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by pdf.js, pptxgenjs & Tesseract.js</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="app.js"></script>
</body>

</html>
